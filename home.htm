<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Quote - Home</title>
</head>
<body id="home">
    <section >
        <h2 class="text-4xl sm:text-5xl md:text-6xl lg:text-4xl text-center m-10 border-b-2 font-extrabold text-[#034531] leading-[1.1]">Müəlliflərin Fikirləri</h2>
        <div class="container mx-auto w-[90%] max-w-[900px] mt-10">
         
            <div id="product-list" class="grid grid-cols-1 lg:grid-cols-3 gap-5 min-h-[250px]">
                
                <!-- cards -->
                
        
            </div>
        
        
            <div class="pagination mt-[30px] flex items-center justify-center gap-5">
                <button id="prevBtn" class="px-5 py-2.5 border border-[#dcdce4] bg-white rounded-lg font-semibold cursor-pointer transition duration-200 hover:not-disabled:bg-[#f0f0f5] hover:not-disabled:border-[#c0c0c8] disabled:opacity-50 disabled:cursor-not-allowed">
                    Geri
                </button>
                
                <span id="pageNumber" class="text-sm text-[#444] font-medium">
                    Səhifə: 1
                </span>
                
                <button id="nextBtn" class="px-5 py-2.5 border border-[#dcdce4] bg-white rounded-lg font-semibold cursor-pointer transition duration-200 hover:not-disabled:bg-[#f0f0f5] hover:not-disabled:border-[#c0c0c8] disabled:opacity-50 disabled:cursor-not-allowed">
                    İrəli
                </button>
            </div>
        </div>
      </section>

      <section>
        <h2 class="text-4xl sm:text-5xl md:text-6xl lg:text-4xl text-center m-10 border-b-2 font-extrabold text-[#034531] leading-[1.1]">BestSellers</h2>
        <div class="p-8 min-h-screen">
      

          <div id="bookcards" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
            
          </div>
          
        </div>
      </section>
      <script src="index.js"></script>
</body>
</html>
